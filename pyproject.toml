[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oryx"
version = "0.1.0"
description = "Local orchestration runtime for AI coding workers."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
oryx = "openclaw_bridge.cli:main"
openclaw-mvp1 = "openclaw_bridge.cli:main"

[tool.setuptools]
packages = ["openclaw_bridge", "orx"]
